<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wakam — Compteur de partie</title>
<meta name="wakam-version" content="15">
<style>
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;background:#f3efe7;color:#2f2a24}
header{background:#3b3026;color:white;padding:14px 16px;position:sticky;top:0;z-index:2}
h1{margin:0;font-size:24px}.sub{opacity:.8;font-size:13px}
main{max-width:1100px;margin:auto;padding:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
button{border:0;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer;background:#5b4636;color:white}
button.secondary{background:#d8cec1;color:#33291f}.danger{background:#9a3f36!important}
button:disabled{opacity:.45;cursor:not-allowed}
.round{font-size:20px;font-weight:800;margin:8px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}
.card{background:white;border-radius:16px;padding:14px;box-shadow:0 2px 10px #0001;border-top:7px solid #777}
.card.red{border-color:#b33a36}.card.yellow{border-color:#d6ad22}.card.purple{border-color:#7b4aa5}.card.blue{border-color:#3f76b5}.card.cowboy-yellow{border-color:#d6ad22}.card.cowboy-blue{border-color:#3f76b5}.card.cowboy-green{border-color:#6da63c}.card.cowboy-red{border-color:#b33a36}.card.green{border-color:#4f9d55}.card.orange{border-color:#d8782a}
.card h2{margin:0 0 8px}.row{display:flex;justify-content:space-between;align-items:center;margin:6px 0;gap:8px}
.val{font-size:20px;font-weight:800}.mini{font-size:12px;color:#6e6257}
section{border-top:1px solid #eee;margin-top:10px;padding-top:8px}
.controls,.unitControls{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.controls button,.unitControls button{padding:8px;font-size:12px}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eee;font-size:12px;font-weight:700}
.badge.gold{background:#f5df73;color:#5d4700}
.alert{background:#fff3cd;border:1px solid #e2bf5d;border-radius:10px;padding:8px;margin:8px 0;font-size:13px;font-weight:700}
.win{background:#dff2df;border:1px solid #6ca66c;border-radius:10px;padding:10px;margin:8px 0;font-weight:800}
.event{background:#f5e3c9;border-left:5px solid #9b6b2f;border-radius:10px;padding:10px;margin:8px 0;font-weight:700}
.notice{background:#fff4cf;border:1px solid #e2c65c;border-radius:12px;padding:10px;margin:10px 0;font-size:13px}
.log{background:#fff;border-radius:12px;padding:10px;margin-top:12px;max-height:280px;overflow:auto;font-size:13px}
input{width:65px;padding:7px;border:1px solid #ccc;border-radius:8px}
.overlay{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.setup{background:white;border-radius:18px;padding:20px;max-width:520px;width:100%;box-shadow:0 8px 30px #0004}
.setup h2{margin-top:0}.choiceGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.choice{background:#eee;color:#33291f}.choice.selected{background:#5b4636;color:white}
.hidden{display:none!important}

.modeGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.modeCard{background:#eee;color:#33291f;text-align:left}
.modeCard.selected{background:#5b4636;color:white}
.sharedBox{background:#f6f0e8;border-radius:12px;padding:12px;margin-top:10px}
.codeBox{font-size:28px;font-weight:900;letter-spacing:5px;text-align:center;background:#fff;border:2px dashed #9b6b2f;border-radius:12px;padding:10px;margin:8px 0}
.role{display:inline-block;padding:4px 8px;border-radius:999px;background:#e5dfd6;font-size:12px;font-weight:800}
.role.master{background:#f5df73;color:#5d4700}
.noticeCenter{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:50;pointer-events:none;width:min(90vw,520px)}
.ephemeral{background:#3b3026;color:white;border-radius:16px;padding:18px 22px;box-shadow:0 8px 35px #0006;text-align:center;font-size:20px;font-weight:900;animation:popIn .22s ease-out}
@keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.victoryOverlay{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
.victoryCard{background:white;border-radius:22px;padding:28px;max-width:460px;width:100%;text-align:center;box-shadow:0 12px 45px #0008}
.victoryCard h2{font-size:32px;margin:0 0 10px}.victoryTribe{font-size:26px;font-weight:900;margin:14px 0}
.playerOnlyNote{background:#f6f0e8;border-radius:10px;padding:8px;margin:8px 0;font-size:12px;font-weight:700}

.deathModal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:70;padding:16px}
.deathCard{background:white;border-radius:18px;padding:20px;max-width:420px;width:100%;box-shadow:0 8px 30px #0005}
.deathCard h3{margin-top:0}.deathCard .field{margin:12px 0}.deathCard select,.deathCard input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:9px}
.createModal{background:white;border-radius:18px;padding:20px;max-width:420px;width:100%;box-shadow:0 8px 30px #0005;text-align:center}.createModal h3{margin-top:0}.quantityGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}.quantityGrid button{font-size:18px;padding:12px}.quantityGrid button:disabled{opacity:.3}
.opponentSummary{margin-top:12px;border-top:1px solid #eee;padding-top:10px}.opponentTable{width:100%;border-collapse:collapse;font-size:12px}.opponentTable th,.opponentTable td{padding:6px 4px;border-bottom:1px solid #eee;text-align:center}.opponentTable th:first-child,.opponentTable td:first-child{text-align:left}
</style>
<link rel="manifest" href="manifest.webmanifest">

<body>
<header><h1>WAKAM</h1><div class="sub">Gestion des ressources, population, unités et bâtiments</div></header>
<main>
<div class="toolbar">
<button onclick="nextTurn()" id="nextTurnBtn">➡️ Tour suivant</button>
<button class="secondary" onclick="saveGame()">💾 Sauvegarder</button>
<button class="secondary" onclick="resetGame()">↺ Nouvelle partie</button>
<button class="secondary hidden" onclick="leaveSharedGame()" id="leaveSharedBtn">🚪 Quitter la partie partagée</button>
</div>
<div class="round" id="round"></div>
<div id="sharedStatus"></div>
<div id="eventNotice"></div>
<div class="grid" id="players"></div>
<div class="log"><b>Historique</b><div id="log"></div></div>
<div id="ephemeralLayer" class="noticeCenter"></div>
<div id="victoryOverlay" class="victoryOverlay hidden"></div>
</main>

<div id="createOverlay" class="overlay hidden"></div>

<div id="deathModal" class="deathModal hidden">
<div class="deathCard">
<h3 id="deathModalTitle">Unités mortes</h3>
<div class="field"><label>Nombre de morts</label><input id="deathCountInput" type="number" min="1" value="1"></div>
<div class="field hidden" id="deathAssignmentField"><label>Affectation des villageois</label><select id="deathAssignmentSelect"><option value="workFood">🌽 Nourriture</option><option value="workWood">🪵 Bois</option><option value="workStone">🪨 Pierre</option><option value="none">👤 Sans affectation</option></select></div>
<div class="controls"><button class="secondary" onclick="closeDeathModal()">Annuler</button><button class="danger" onclick="confirmDeathModal()">Confirmer</button></div>
</div></div>

<div class="overlay" id="setupOverlay">
<div class="setup">
<h2>Nouvelle partie WAKAM</h2>
<div class="modeGrid">
<button class="modeCard selected" id="soloModeBtn" onclick="selectMode('solo')">🎲 Partie classique<br><small>Un seul téléphone</small></button>
<button class="modeCard" id="sharedModeBtn" onclick="selectMode('shared')">🌐 Partie partagée<br><small>Plusieurs téléphones</small></button>
</div>
<div id="soloSetup">
<div>Choisissez le nombre de joueurs :</div>
<div class="choiceGrid">
<button class="choice" data-count="2" onclick="selectPlayerCount(2)">2 joueurs</button>
<button class="choice" data-count="3" onclick="selectPlayerCount(3)">3 joueurs</button>
<button class="choice" data-count="4" onclick="selectPlayerCount(4)">4 joueurs</button>
</div>
<div id="tribeChoices" class="choiceGrid"></div>
<button onclick="startGame()" id="startBtn" disabled>Commencer la partie</button>
</div>
<div id="sharedSetup" class="hidden">
<div class="sharedBox">
<b>👑 Créer une partie partagée</b>
<div style="margin-top:6px">Le maître du jeu peut être l'un des joueurs.</div>
<button onclick="showSharedCreate()" style="margin-top:8px">Créer une partie</button>
</div>
<div class="sharedBox">
<b>👤 Rejoindre une partie</b>
<div class="row"><span>Code</span><input id="joinCodeInput" maxlength="6" style="width:110px;text-transform:uppercase"></div>
<button onclick="prepareJoinShared()">Rechercher la partie</button>
</div>
<div id="sharedSetupDetails"></div>
</div>
</div>
</div>

<script>
const TYPES=[
 {key:'red',name:'Iroquois',emoji:'🔴',faction:'indian'},
 {key:'yellow',name:'Cheyennes',emoji:'🟡',faction:'indian'},
 {key:'purple',name:'Lakota',emoji:'🟣',faction:'indian'},
 {key:'blue',name:'Cherokee',emoji:'🔵',faction:'indian'},
 {key:'green',name:'Comanche',emoji:'🟢',faction:'indian'},
 {key:'orange',name:'Apache',emoji:'🟠',faction:'indian'},
 {key:'cowboy-yellow',name:'Texas',emoji:'🟡',faction:'cowboy'},
 {key:'cowboy-blue',name:'Colorado',emoji:'🔵',faction:'cowboy'},
 {key:'cowboy-green',name:'Montana',emoji:'🟢',faction:'cowboy'},
 {key:'cowboy-red',name:'Arizona',emoji:'🔴',faction:'cowboy'}
];

const INDIAN_BUILDINGS=[
 ['Écurie',300,200],
 ['Cabane des archers',300,200],
 ['Port',300,200],
 ['Pont',400,200],
 ['Habitation',200,50],
 ['Foyer',150,100],
 ['Totem',400,0]
];

const COWBOY_BUILDINGS=[
 ['Ranch',300,200],
 ['Cabane de munitions',300,200],
 ['Port',300,200],
 ['Pont',400,200],
 ['Tente',200,50],
 ['Centre ville',300,300],
 ['Mine',150,50],
 ['Saloon',200,100]
];

const UNIT_COSTS={
 villager:[50,0],
 archer:[50,50],
 cavalry:[150,50],
 canoe:[0,100]
};

function isCowboy(p){return p?.faction==='cowboy';}
function buildingList(p){return isCowboy(p)?COWBOY_BUILDINGS:INDIAN_BUILDINGS;}
function buildingHomeName(p){return isCowboy(p)?'Centre ville':'Foyer';}
function housingName(p){return isCowboy(p)?'Tente':'Habitation';}
function workerName(p){return isCowboy(p)?'Colons':'Villageois';}
function unitLabel(p,type,plural=false){
 const labels=isCowboy(p)?{villager:'colon',archer:'cowboy',cavalry:'cowboy à cheval',canoe:'barque'}:{villager:'villageois',archer:'archer',cavalry:'cavalier',canoe:'canoë'};
 const l=labels[type]||type;
 return plural?(l==='cowboy à cheval'||l==='villageois'||l==='cavalier'||l==='canoë'||l==='barque'||l==='colon'?l+'s':l+'s'):l;
}
function unitPop(p,type){return type==='cavalry'?2:(type==='canoe'?0:1);}
function militaryCount(p){return isCowboy(p)?(p.archers||0)+(p.cavalry||0):0;}
function metalMaintenance(p){return isCowboy(p)?Math.ceil(militaryCount(p)/5)*50:0;}
function unitCostsFor(p,type){
 if(isCowboy(p))return type==='villager'?{food:50,wood:0,metal:0}:type==='archer'?{food:50,wood:0,metal:50}:type==='cavalry'?{food:150,wood:0,metal:50}:{food:0,wood:100,metal:0};
 return type==='villager'?{food:50,wood:0,metal:0}:type==='archer'?{food:50,wood:50,metal:0}:type==='cavalry'?{food:150,wood:50,metal:0}:{food:0,wood:100,metal:0};
}

/* Épuisement :
   - forêt ET carrière ont chacune leur propre calendrier ;
   - premier épuisement de chacune : aléatoire entre les tours 8 et 10 inclus ;
   - après chaque épuisement, la même ressource revient aléatoirement 8 à 10 tours plus tard ;
   - les deux événements sont donc totalement indépendants et ne peuvent plus être
     séparés artificiellement par un système d'alternance.
*/
const FIRST_EXHAUSTION_MIN=8;
const FIRST_EXHAUSTION_MAX=10;
const NEXT_EXHAUSTION_MIN=8;
const NEXT_EXHAUSTION_MAX=10;

function randomInt(min,max){
 return Math.floor(Math.random()*(max-min+1))+min;
}
function randomFirstExhaustion(){
 return randomInt(FIRST_EXHAUSTION_MIN,FIRST_EXHAUSTION_MAX);
}
function scheduleNextExhaustion(type){
 const next=state.round+randomInt(NEXT_EXHAUSTION_MIN,NEXT_EXHAUSTION_MAX);
 if(type==='forest') state.nextForestExhaustionRound=next;
 if(type==='quarry') state.nextQuarryExhaustionRound=next;
}

let selectedCount=0,selectedTribes=[];
let state={
 round:1,
 nextForestExhaustionRound:randomFirstExhaustion(),
 nextQuarryExhaustionRound:randomFirstExhaustion(),
 currentEvent:null,
  currentEventRound:null,
 players:[],
 logs:[]
};
Object.defineProperty(window,'wakamState',{
 configurable:true,
 get:()=>state,
 set:v=>{state=v}
});


function freshPlayer(t){
 return {
  ...t,
  food:250,wood:0,stone:0,gold:0,
  faction:t.faction||'indian',
  chief:1,chiefName:'',villagers:0,archers:0,cavalry:0,canoes:0,
  workFood:0,workWood:0,workStone:0,workMetal:0,
  buildings:{[t.faction==='cowboy'?'Centre ville':'Foyer']:1},
  upgrades:{archer:false,cavalry:false,archerElite:false,cavalryArcher:false},
  defeated:false,
  saloonRecruitRound:0
 };
}

function pop(p){
 return p.chief+p.villagers+p.archers+p.cavalry*2;
}

function housingCapacity(p){
 const housing=(p.buildings[housingName(p)]||0)*10;
 const townCenter=isCowboy(p)?(p.buildings['Centre ville']||0)*5:0;
 return 10+housing+townCenter;
}

function requiredHouses(p){
 const deficit=Math.max(0,pop(p)-housingCapacity(p));
 return Math.ceil(deficit/10);
}

function foodCost(p){
 return Math.floor(pop(p)/10)*200;
}

function canoeIncome(p){
 return p.canoes*50;
}

function totalWorkers(p){
 return p.workFood+p.workWood+p.workStone+(isCowboy(p)?p.workMetal:0);
}

function totalBuildingCount(p){
 return Object.values(p.buildings||{}).reduce((sum,v)=>sum+(Number(v)||0),0);
}

function buildingMaintenance(p){
 return totalBuildingCount(p)*10;
}

function activePlayers(){
 return state.players.filter(p=>!p.defeated);
}

function selectPlayerCount(n){
 selectedCount=n;
 selectedTribes=[];
 document.querySelectorAll('[data-count]').forEach(b=>b.classList.toggle('selected',+b.dataset.count===n));
 const box=document.getElementById('tribeChoices');
 box.innerHTML=`<div style="grid-column:1/-1;font-weight:800;margin-top:4px">🪶 Nations amérindiennes</div>${TYPES.filter(t=>t.faction==='indian').map(t=>`<button class="choice" id="tribe_${t.key}" onclick="toggleTribe('${t.key}')">${t.emoji} ${t.name}</button>`).join('')}<div style="grid-column:1/-1;font-weight:800;margin-top:8px">🤠 Cow-boys</div>${TYPES.filter(t=>t.faction==='cowboy').map(t=>`<button class="choice" id="tribe_${t.key}" onclick="toggleTribe('${t.key}')">${t.emoji} ${t.name}</button>`).join('')}`;
 updateSetup();
}

function toggleTribe(key){
 if(selectedTribes.includes(key)) selectedTribes=selectedTribes.filter(x=>x!==key);
 else if(selectedTribes.length<selectedCount) selectedTribes.push(key);
 updateSetup();
}

function updateSetup(){
 TYPES.forEach(t=>{
  const b=document.getElementById('tribe_'+t.key);
  if(b)b.classList.toggle('selected',selectedTribes.includes(t.key));
 });
 const start=document.getElementById('startBtn');
 start.disabled=!(selectedCount>=2 && selectedTribes.length===selectedCount);
}

function startGame(){
 if(selectedTribes.length!==selectedCount)return;
 state={
  round:1,
  nextForestExhaustionRound:randomFirstExhaustion(),
  nextQuarryExhaustionRound:randomFirstExhaustion(),
  currentEvent:null,
  currentEventRound:null,
  players:TYPES.filter(t=>selectedTribes.includes(t.key)).map(freshPlayer),
  logs:[]
 };
 document.getElementById('setupOverlay').classList.add('hidden');
 log('Nouvelle partie : '+selectedCount+' joueurs.');
 render();
}

function setVal(i,key,v){
 const p=state.players[i];
 let nv=Math.max(0,parseInt(v)||0);
 if(['workFood','workWood','workStone','workMetal'].includes(key)){
  const other=totalWorkers(p)-(p[key]||0);
  nv=Math.min(nv,Math.max(0,p.villagers-other));
 }
 p[key]=nv;
 render();
}

function adjust(i,key,d){
 const p=state.players[i];
 if(['workFood','workWood','workStone','workMetal'].includes(key) && d>0 && totalWorkers(p)>=p.villagers){
  alert('Tous les villageois disponibles sont déjà affectés à un travail.');
  return;
 }
 p[key]=Math.max(0,p[key]+d);
 render();
}

function openDeathModal(i,type){
 const p=state.players[i];
 if(!p)return;
 const key=type==='villager'?'villagers':type==='archer'?'archers':type==='cavalry'?'cavalry':type==='canoe'?'canoes':'chief';
 const max=Number(p[key]||0);
 if(max<=0){alert(type==='villager'?'Aucun villageois disponible.':'Aucune unité disponible.');return;}
 window.deathModalState={i,type,max};
 document.getElementById('deathModalTitle').textContent=(type==='villager'?(isCowboy(p)?'Colons morts':'Villageois morts'):` ${unitLabel(p,type,true)} morts`);
 const input=document.getElementById('deathCountInput'); input.max=max; input.value=1;
 const af=document.getElementById('deathAssignmentField');
 af.classList.toggle('hidden',type!=='villager');
 if(type==='villager'){
  const sel=document.getElementById('deathAssignmentSelect');
  sel.innerHTML=`<option value="workFood">🌽 Nourriture (${p.workFood})</option><option value="workWood">🪵 Bois (${p.workWood})</option><option value="workStone">🪨 Pierre (${p.workStone})</option>${isCowboy(p)?`<option value="workMetal">⚙️ Métal (${p.workMetal||0})</option>`:''}<option value="none">👤 Sans affectation (${Math.max(0,p.villagers-totalWorkers(p))})</option>`;
 }
 document.getElementById('deathModal').classList.remove('hidden');
}
function closeDeathModal(){document.getElementById('deathModal').classList.add('hidden');window.deathModalState=null;}
function confirmDeathModal(){
 const st=window.deathModalState;if(!st)return;
 const p=state.players[st.i]; const n=Math.max(1,parseInt(document.getElementById('deathCountInput').value)||0);
 if(n>st.max){alert(`Maximum : ${st.max}.`);return;}
 if(st.type==='villager'){
  const work=document.getElementById('deathAssignmentSelect').value;
  const available=work==='workFood'?p.workFood:work==='workWood'?p.workWood:work==='workStone'?p.workStone:work==='workMetal'?(p.workMetal||0):p.villagers-totalWorkers(p);
  if(n>available){alert(`Il n'y a que ${Math.max(0,available)} villageois dans cette affectation.`);return;}
  p.villagers-=n; if(work!=='none')p[work]-=n;
 }else{
  const key=st.type==='archer'?'archers':st.type==='cavalry'?'cavalry':st.type==='canoe'?'canoes':'chief';
  p[key]=Math.max(0,(p[key]||0)-n);
  if(st.type==='chief') eliminatePlayer(p,isCowboy(p)?'le Shérif est mort':'le chef est mort');
 }
 closeDeathModal();
 checkVictory(); render();
}
function killVillager(i){openDeathModal(i,'villager');}

function createUnit(i,type){
 const p=state.players[i];
 if(!p)return;
 if(type==='chief'){
  alert('Chaque camp commence avec un seul chef. Un deuxième chef ne peut pas être recruté.');
  return;
 }
 const cost=unitCostsFor(p,type);
 const unitPop=unitPopForCreation(p,type);
 const availableHousing=unitPop===0?Infinity:Math.max(0,Math.floor((housingCapacity(p)-pop(p))/unitPop));
 const maxByFood=cost.food>0?Math.floor(p.food/cost.food):Infinity;
 const maxByWood=cost.wood>0?Math.floor(p.wood/cost.wood):Infinity;
 const maxByMetal=cost.metal>0?Math.floor((p.metal||0)/cost.metal):Infinity;
 const maxAffordable=Math.min(10,availableHousing,maxByFood,maxByWood,maxByMetal);
 if(maxAffordable<=0){
  if(unitPop>0&&availableHousing<=0)alert(`Capacité de logement insuffisante. Construisez une ${housingName(p).toLowerCase()} supplémentaire.`);
  else alert('Ressources insuffisantes.');
  return;
 }
 openCreateQuantityModal(i,type,maxAffordable);
}


function recruitSaloonCowboy(i){
 const p=state.players[i];
 if(!p||!isCowboy(p))return;
 if((p.buildings?.['Saloon']||0)<=0){alert('Construisez un Saloon pour recruter un Cowboy.');return;}
 if(p.saloonRecruitRound===state.round){alert('Le Saloon a déjà recruté un Cowboy ce tour.');return;}
 if(pop(p)>=housingCapacity(p)){alert('Capacité de logement insuffisante.');return;}
 if(p.food<50){alert('Ressources insuffisantes : il faut 50 nourriture.');return;}
 p.food-=50;
 p.archers=(p.archers||0)+1;
 p.saloonRecruitRound=state.round;
 log(`🍺 ${p.name}: recrutement d'un Cowboy au Saloon (-50 nourriture)`);
 render();
}

function unitPopForCreation(p,type){return unitPop(p,type);}

function openCreateQuantityModal(i,type,maxAffordable){
 const p=state.players[i];
 const overlay=document.getElementById('createOverlay');
 if(!overlay)return;
 const label=unitLabel(p,type);
 overlay.innerHTML=`<div class="createModal">
  <h3>Créer ${label}${label==='villageois'?'':maxAffordable>1?'s':''}</h3>
  <div>Choisissez directement le nombre :</div>
  <div class="quantityGrid">${Array.from({length:10},(_,n)=>{const q=n+1;return `<button ${q>maxAffordable?'disabled':''} onclick="confirmCreateUnit(${i},'${type}',${q})">${q}</button>`;}).join('')}</div>
  <div class="mini">Maximum disponible : ${maxAffordable}</div>
  <div class="deathActions"><button class="secondary" onclick="closeCreateQuantityModal()">Annuler</button></div>
 </div>`;
 overlay.classList.remove('hidden');
}

function closeCreateQuantityModal(){
 const overlay=document.getElementById('createOverlay');
 if(overlay){overlay.classList.add('hidden');overlay.innerHTML='';}
}

function confirmCreateUnit(i,type,quantity){
 const before=JSON.parse(JSON.stringify(state.players));
 const p=state.players[i];
 if(!p||!Number.isInteger(quantity)||quantity<1)return;
 const cost=unitCostsFor(p,type);
 const unitPop=unitPopForCreation(p,type);
 const availableHousing=unitPop===0?Infinity:Math.max(0,Math.floor((housingCapacity(p)-pop(p))/unitPop));
 const maxByFood=cost.food>0?Math.floor(p.food/cost.food):Infinity;
 const maxByWood=cost.wood>0?Math.floor(p.wood/cost.wood):Infinity;
 const maxByMetal=cost.metal>0?Math.floor((p.metal||0)/cost.metal):Infinity;
 const maxAffordable=Math.min(10,availableHousing,maxByFood,maxByWood,maxByMetal);
 if(quantity>maxAffordable){alert('Cette quantité n’est plus disponible.');closeCreateQuantityModal();return;}
 p.food-=cost.food*quantity;
 p.wood-=cost.wood*quantity;
 p.metal=(p.metal||0)-cost.metal*quantity;
 if(type==='villager')p.villagers+=quantity;
 if(type==='archer')p.archers+=quantity;
 if(type==='cavalry')p.cavalry+=quantity;
 if(type==='canoe')p.canoes+=quantity;
 const createdLabel=unitLabel(p,type,quantity>1);
 log(p.emoji+' '+p.name+': création de '+quantity+' '+createdLabel);
 closeCreateQuantityModal();
 render();
 const after=JSON.parse(JSON.stringify(currentPlayers()));
 const notices=diffNotifications(before,after,state.round);
 notices.forEach(n=>showEphemeral(n.message));
 if(window.wakamSyncAfterCreate)window.wakamSyncAfterCreate(before,after);
}

function labelUnit(type){
 return type==='villager'?'villageois':type==='archer'?'archer':type==='cavalry'?'cavalier':'canoë';
}

function killUnit(i,type){
 const p=state.players[i];
 if(!p)return;
 if(type==='villager'||type==='archer'||type==='cavalry'||type==='canoe'){openDeathModal(i,type);return;}
 if(type==='chief'){
  if(!p.chief)return;
  p.chief=0;
  eliminatePlayer(p,isCowboy(p)?'le Shérif est mort':'le chef est mort');
 }
}

function eliminatePlayer(p,reason){
 if(p.defeated)return;
 p.defeated=true;
 log('☠️ '+p.name+': '+reason+'. Tribu éliminée.');
 checkVictory();
 render();
}

function build(i,n){
 const p=state.players[i];
 const b=buildingList(p)[n];
 const wood=b[1],stone=b[2];

 if(p.wood<wood||p.stone<stone){
  alert('Ressources insuffisantes');
  return;
 }

 p.wood-=wood;
 p.stone-=stone;
 p.buildings[b[0]]=(p.buildings[b[0]]||0)+1;

 log(p.emoji+' '+p.name+': construction '+b[0]);
 render();
}

function destroyBuilding(i,name){
 const p=state.players[i];
 if(!(p.buildings[name]>0))return;

 p.buildings[name]--;

 log('💥 '+p.name+': destruction de '+name+'.');

 if(name===buildingHomeName(p) && p.buildings[buildingHomeName(p)]<=0){
  eliminatePlayer(p,isCowboy(p)?'le dernier Centre ville a été détruit':'le dernier Foyer a été détruit');
  return;
 }

 if(name===housingName(p) && pop(p)>housingCapacity(p)){
  alert('Attention : la population dépasse maintenant la capacité de logement.');
 }

 checkVictory();
 render();
}

function convertStone(i){
 const p=state.players[i];

 if(p.stone<1000){
  alert('Il faut 1000 pierre pour obtenir 100 or.');
  return;
 }

 p.stone-=1000;
 p.gold+=100;

 log(`${p.emoji} ${p.name}: échange de 1000 🪨 contre 100 🟡 or`);
 render();
}

  // VERSION 14 — épuisement temporairement neutralisé pour diagnostic.
  // Aucun état, événement, historique ou synchronisation n'est modifié ici.

function applyTurnProduction(){
 state.players.forEach(p=>{
  if(p.defeated)return;

  const pf=p.workFood*50;
  const pw=p.workWood*50;
  const ps=p.workStone*50;
  const pm=isCowboy(p)?(p.workMetal||0)*50:0;
  const pc=canoeIncome(p);

  p.food+=pf+pc;
  p.wood+=pw;
  p.stone+=ps;
  if(isCowboy(p))p.metal=(p.metal||0)+pm;

  const maintenance=buildingMaintenance(p);
  const paidWood=Math.min(p.wood,maintenance);
  p.wood-=paidWood;

  if(paidWood<maintenance){
   log(`⚠️ ${p.emoji} ${p.name}: manque ${maintenance-paidWood} bois pour l'entretien des bâtiments (${maintenance} 🪵 requis).`);
  }else if(maintenance>0){
   log(`${p.emoji} ${p.name}: -${maintenance} 🪵 d'entretien des bâtiments.`);
  }

  const militaryMetal=metalMaintenance(p);
  const paidMetal=Math.min(p.metal||0,militaryMetal);
  if(isCowboy){
   p.metal=(p.metal||0)-paidMetal;
   if(paidMetal<militaryMetal){
    log(`⚠️ ${p.emoji} ${p.name}: manque ${militaryMetal-paidMetal} métal pour l'entretien militaire (${militaryMetal} ⚙️ requis).`);
   }else if(militaryMetal>0){
    log(`${p.emoji} ${p.name}: -${militaryMetal} ⚙️ d'entretien militaire.`);
   }
  }

  const fc=foodCost(p);
  p.food=Math.max(0,p.food-fc);

  log(`${p.emoji} ${p.name}: T${state.round} +${pf} nourriture, +${pc} ${isCowboy(p)?'barques':'canoës'}, +${pw} bois, +${ps} pierre${isCowboy(p)?`, +${pm} métal`:''}, -${fc} nourriture`);
 });
}

function nextTurn(){
 if(activePlayers().length<=1){
  alert('La partie est terminée.');
  return;
 }

 applyTurnProduction();

 state.round++;

 // Un événement d'épuisement n'est visible que pendant le tour où il est déclenché.
 // Au passage au tour suivant, on l'efface avant de vérifier les nouveaux épuisements.
 if(state.currentEventRound!==state.round){
  state.currentEvent=null;
  state.currentEventRound=null;
 }

 if(state.round>=state.nextForestExhaustionRound){
  triggerExhaustion('forest');
 }
 if(state.round>=state.nextQuarryExhaustionRound){
  triggerExhaustion('quarry');
 }

 checkVictory();
 render();
}

function checkVictory(){
 const alive=activePlayers();
 if(alive.length===1){
  const winner=alive[0];
  const victoryText='🏆 Victoire de '+winner.emoji+' '+winner.name+' !';
  const already=state.logs.includes(victoryText);
  if(!already){
   state.logs.unshift(victoryText);
   showEphemeral(victoryText,7000);
   showVictoryScreen(winner);
  }
 }else if(alive.length===0){
  const victoryText='🏆 Tous les joueurs sont éliminés.';
  if(!state.logs.includes(victoryText)){
   state.logs.unshift(victoryText);
   showEphemeral(victoryText,7000);
   showVictoryScreen(null);
  }
 }
}

function showVictoryScreen(winner){
 const box=document.getElementById('victoryOverlay');
 if(!box)return;
 if(winner){
  box.innerHTML=`<div class="victoryCard"><h2>🏆 VICTOIRE !</h2><div class="victoryTribe">${winner.emoji} ${winner.name}${winner.chiefName?'<br>👑 '+escapeHtml(winner.chiefName):''}</div><p>La dernière tribu encore en lice remporte la partie.</p><button onclick="closeVictoryScreen()">Continuer à consulter la partie</button></div>`;
 }else{
  box.innerHTML=`<div class="victoryCard"><h2>🏆 FIN DE PARTIE</h2><div class="victoryTribe">Toutes les tribus sont éliminées.</div><button onclick="closeVictoryScreen()">Continuer à consulter la partie</button></div>`;
 }
 box.classList.remove('hidden');
}

 state.logs.unshift(s);

}

function resetGame(){
 if(!confirm('Commencer une nouvelle partie ?'))return;

 state={
  round:1,
  nextForestExhaustionRound:randomFirstExhaustion(),
  nextQuarryExhaustionRound:randomFirstExhaustion(),
  currentEvent:null,
  currentEventRound:null,
  players:[],
  logs:[]
 };

 selectedCount=0;
 selectedTribes=[];

 document.getElementById('setupOverlay').classList.remove('hidden');
 document.getElementById('tribeChoices').innerHTML='';
 document.getElementById('startBtn').disabled=true;
 document.querySelectorAll('[data-count]').forEach(b=>b.classList.remove('selected'));
 render();
}

function normalizeLoadedState(){
 if(!state||!Array.isArray(state.players)){
  state={
   round:1,
   nextForestExhaustionRound:randomFirstExhaustion(),
   legacyLastExhaustionType:null,
   currentEvent:null,
   currentEventRound:null,
   players:[],
   logs:[]
  };
  return;
 }

 state.players.forEach(p=>{
  if(typeof p.gold!=='number')p.gold=0;
  if(!p.faction)p.faction=(String(p.key||'').startsWith('cowboy-')?'cowboy':'indian');
  if(isCowboy(p)&&typeof p.metal!=='number')p.metal=0;
  if(!p.upgrades)p.upgrades={archer:false,cavalry:false,archerElite:false,cavalryArcher:false};
  if(typeof p.upgrades.archer!=='boolean')p.upgrades.archer=false;
  if(typeof p.upgrades.cavalry!=='boolean')p.upgrades.cavalry=false;
  if(typeof p.upgrades.archerElite!=='boolean')p.upgrades.archerElite=false;
  if(typeof p.upgrades.cavalryArcher!=='boolean')p.upgrades.cavalryArcher=false;
  if(typeof p.canoes!=='number')p.canoes=0;
  if(typeof p.chief!=='number')p.chief=1;
   if(typeof p.chiefName!=='string')p.chiefName='';
  if(typeof p.defeated!=='boolean')p.defeated=false;
  if(typeof p.workFood!=='number')p.workFood=0;
  if(typeof p.workWood!=='number')p.workWood=0;
  if(typeof p.workStone!=='number')p.workStone=0;
  if(typeof p.workMetal!=='number')p.workMetal=0;
  if(!p.buildings)p.buildings={[buildingHomeName(p)]:1};
  const home=buildingHomeName(p);
  if(typeof p.buildings[home]!=='number')p.buildings[home]=1;
  if(p.buildings[home]<0)p.buildings[home]=0;
 });

 /* Anciennes sauvegardes : on recrée deux calendriers indépendants. */
 if(typeof state.nextForestExhaustionRound!=='number'){
  state.nextForestExhaustionRound=state.round+randomInt(FIRST_EXHAUSTION_MIN,FIRST_EXHAUSTION_MAX);
 }
 if(typeof state.nextQuarryExhaustionRound!=='number'){
  state.nextQuarryExhaustionRound=state.round+randomInt(FIRST_EXHAUSTION_MIN,FIRST_EXHAUSTION_MAX);
 }
 if(!('currentEvent'in state))state.currentEvent=null;
 if(!('currentEventRound'in state))state.currentEventRound=null;
 if(!Array.isArray(state.logs))state.logs=[];
}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}


function setChiefName(i){
  const p=state.players[i];
  if(!p)return;
  const name=prompt('Nom du '+(isCowboy(p)?'Shérif':'chef')+' de '+p.name+':',p.chiefName||'');
  if(name===null)return;
  p.chiefName=name.trim().slice(0,40);
  log('👑 '+p.name+': chef nommé '+(p.chiefName||'sans nom'));
  render();
}

function subscribeShared(){
 if(sharedUnsub)sharedUnsub();
 if(sharedPlayerStatesUnsub)sharedPlayerStatesUnsub();
 sharedUnsub=onSnapshot(doc(db,'games',sharedGameId),snap=>{
  if(!snap.exists()){alert('Cette partie n’existe plus.');return;}
  const g=snap.data();
  sharedMaster=(g.masterUid===uid);
  if(sharedPendingWrites>0)return;

  window.wakamState={
   round:g.round||1,
   nextForestExhaustionRound:g.nextForestExhaustionRound,
   nextQuarryExhaustionRound:g.nextQuarryExhaustionRound,
   currentEvent:g.currentEvent||null,
   currentEventRound:g.currentEventRound??null,
   players:Array.isArray(g.players)?g.players:[],
   logs:Array.isArray(g.logs)?g.logs:[],
  };
  if(sharedPlayerKey==null)sharedPlayerKey=g.masterPlayerKey;
  showNotifications(g.notifications||[]);
  loadChiefNames(g);
  const victory=g.logs?.find(x=>String(x).startsWith('🏆 Victoire de '));
  if(victory && !seen.has('victory:'+g.round)){ seen.add('victory:'+g.round); const w=g.players?.find(p=>victory.includes(p.name)); if(w)showVictoryScreen(w); }
  window.render();
 });

 // Les joueurs non-maîtres écrivent leur propre tribu dans playerStates/{playerKey}.
 // Cette sous-collection permet de respecter les règles Firestore : un joueur ne
 // peut jamais écrire l'état d'une autre tribu.
 sharedPlayerStatesUnsub=onSnapshot(collection(db,'games',sharedGameId,'playerStates'),snap=>{
  let changed=false;
  const players=currentPlayers().slice();
  snap.docs.forEach(d=>{
   const data=d.data();
   if(!data?.playerKey||!data?.player)return;
   const idx=players.findIndex(p=>p.key===data.playerKey);
   if(idx<0)return;
   players[idx]=data.player;
   changed=true;
   (data.notifications||[]).forEach(n=>{
    if(!n||seen.has(n.id))return;
    // Les créations sont privées à la tribu ciblée ; les morts/destructions
    // sont publiques et utilisent targetKey === null.
    if(n.targetKey===null || n.targetKey===sharedPlayerKey){
     seen.add(n.id);
     showEphemeral(n.message);
    }
   });
  });
  if(changed){
   window.wakamState={...window.wakamState,players};
   window.render();
  }
 });
}

    }else if(sharedPlayerKey){
      const ms=await getDoc(doc(db,'games',sharedGameId,'members',uid));
      if(ms.exists()){const m=ms.data();if(typeof m.chiefName==='string')names.set(sharedPlayerKey,m.chiefName);}
    }
    if(names.size){
      let changed=false;
      const players=(g.players||[]).map(p=>{const n=names.get(p.key);if(n!==undefined&&p.chiefName!==n){changed=true;return {...p,chiefName:n};}return p;});
      if(changed){
        window.wakamState={...window.wakamState,players};
        window.render();
        if(sharedMaster)await updateDoc(doc(db,'games',sharedGameId),{players});
      }

}

function showNotifications(list){
 for(const n of list){
  if(!n||seen.has(n.id))continue;
  // targetKey === null = notification publique ; sinon seule la tribu ciblée.
  if(n.targetKey===null || n.targetKey===sharedPlayerKey){
   seen.add(n.id);showEphemeral(n.message);
  }
 }
}
function showEphemeral(message,duration=5000){
 const layer=document.getElementById('ephemeralLayer');
 layer.innerHTML=`<div class="ephemeral">${escapeHtml(message)}</div>`;
 clearTimeout(ephemeralTimer);
 ephemeralTimer=setTimeout(()=>layer.innerHTML='',duration);
}
function escapeHtml(s){
 return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}

function currentPlayers(){
 return window.wakamState.players||[];
}
function findPlayer(key){return currentPlayers().find(p=>p.key===key);}
function snapshotPlayers(){

 a.__event=window.wakamState.currentEvent||null;
 a.__aliveKeys=currentPlayers().filter(p=>!p.defeated).map(p=>p.key);
 return a;
}
function diffNotifications(before,after,round){
 const out=[];
 after.forEach((p,idx)=>{
  const b=before.find(x=>x.key===p.key);
  if(!b)return;
  const add=(text,targetKey=p.key)=>out.push({id:Date.now().toString()+Math.random(),targetKey,message:text,round});
  const units=[['villagers',p=>isCowboy(p)?'colon':'villageois'],['archers',p=>isCowboy(p)?'cowboy':'archer'],['cavalry',p=>isCowboy(p)?'cowboy à cheval':'cavalier'],['canoes',p=>isCowboy(p)?'barque':'canoë']];
  units.forEach(([k,labelFn])=>{
   const label=labelFn(p);
   const d=(p[k]||0)-(b[k]||0);
   if(d>0){
    const pluralLabel=label+(d>1?'s':'');
    add(`+${d} ${pluralLabel} créé${d>1?'s':''}`);
   }
   if(d<0){
    let extra='';
    if(k==='villagers'){
      const changes=[['workFood','nourriture'],['workWood','bois'],['workStone','pierre'],...(isCowboy(p)?[['workMetal','métal']]:[])].map(([wk,l])=>({wk,l,d:(p[wk]||0)-(b[wk]||0)})).filter(x=>x.d<0);
      if(changes.length===1)extra=` — affectation : ${changes[0].l}`;
      else if(changes.length>1)extra=` — affectations modifiées`;
    }
    const count=Math.abs(d);
     const verb=count>1?'sont morts':'est mort';
     const unitName=label+(count>1?'s':'');
     add(`☠️ ${count} ${unitName} ${p.name.toLowerCase()} ${verb}${extra}`,null);
   }
  });
  const buildings=new Set([...Object.keys(b.buildings||{}),...Object.keys(p.buildings||{})]);
  buildings.forEach(k=>{
   const d=(p.buildings?.[k]||0)-(b.buildings?.[k]||0);
   if(d>0)add(`🏗️ ${d>1?d+' ':''}${k} créé${d>1?'s':''}`);
   if(d<0){
    const count=Math.abs(d);
    const info={
     'Écurie':['Une','Écuries','détruites'],
     'Cabane des archers':['Une','Cabanes des archers','détruites'],
     'Port':['Un','Ports','détruits'],
     'Pont':['Un','Ponts','détruits'],
     'Habitation':['Une','Habitations','détruites'],
     'Foyer':['Un','Foyers','détruits'],
     'Totem':['Un','Totems','détruits'],
     'Ranch':['Un','Ranchs','détruits'],
     'Cabane de munitions':['Une','Cabanes de munitions','détruites'],
     'Tente':['Une','Tentes','détruites'],
     'Centre ville':['Un','Centres ville','détruits'],
     'Mine':['Une','Mines','détruites'],
     'Saloon':['Un','Saloons','détruits']
    }[k]||['Un',k+'s','détruits'];
    const text=count>1
     ? `💥 ${count} ${info[1]} ${p.name.toLowerCase()} ont été ${info[2]}.`
     : `💥 ${info[0]} ${k.toLowerCase()} ${p.name.toLowerCase()} a été ${info[2]}.`;
    add(text,null);
   }
  });
  if(!!p.upgrades?.archer&&!b.upgrades?.archer)add(`${isCowboy(p)?'🤠':'🏹'} Amélioration des ${isCowboy(p)?'cowboys':'archers'} : déplacement 2 tuiles`);
  if(!!p.upgrades?.cavalry&&!b.upgrades?.cavalry)add(`🐎 Amélioration des ${isCowboy(p)?'cowboys à cheval':'cavaliers'} : déplacement 3 tuiles`);
  if(!!p.upgrades?.archerElite&&!b.upgrades?.archerElite)add(`${isCowboy(p)?'🤠💥':'🎯'} ${isCowboy(p)?'Cowboys d’élite':'Archers d’élite'} : portée d’attaque 3 tuiles`);
  if(!!p.upgrades?.cavalryArcher&&!b.upgrades?.cavalryArcher)add(`${isCowboy(p)?'🐎💥':'🐎🏹'} ${isCowboy(p)?'Cowboy à cheval expérimenté':'Cavaliers archers'} : portée d’attaque ${isCowboy(p)?'3':'2'} tuiles`);
  if((p.workFood||0)!==(b.workFood||0))add(`🌽 ${p.workFood} ${workerName(p).toLowerCase()} affectés à la nourriture`);
  if((p.workWood||0)!==(b.workWood||0))add(`🪵 ${p.workWood} ${workerName(p).toLowerCase()} affectés au bois`);
  if((p.workStone||0)!==(b.workStone||0))add(`🪨 ${p.workStone} ${workerName(p).toLowerCase()} affectés à la pierre`);
  if(isCowboy(p)&&(p.workMetal||0)!==(b.workMetal||0))add(`⚙️ ${p.workMetal||0} colons affectés au métal`);
  if((p.chief||0)<(b.chief||0))add(`☠️ Le ${isCowboy(p)?'Shérif':'chef'} est mort`);
  if(!b.defeated&&p.defeated){
     if((p.chief||0)<(b.chief||0)) add(`☠️ VOTRE ${isCowboy(p)?'ÉQUIPE':'TRIBU'} EST ÉLIMINÉE — votre ${isCowboy(p)?'Shérif':'chef'} est mort.`);
     else if((p.buildings?.[buildingHomeName(p)]||0)<=0) add(`☠️ VOTRE ${isCowboy(p)?'ÉQUIPE':'TRIBU'} EST ÉLIMINÉE — votre dernier ${buildingHomeName(p)} a été détruit.`);
     else add('☠️ VOTRE TRIBU EST ÉLIMINÉE.');
   }
 });
 return out;
}

function cloneSharedState(){
 return JSON.parse(JSON.stringify(window.wakamState));
}

async function syncShared(before,afterState,gameId){
  if(!sharedMode||!sharedMaster||!gameId)return;

  const s=afterState;
  const notices=diffNotifications(before,s.players,s.round);

  if(s.currentEvent&&s.currentEventRound===s.round && (!before.__event || before.__event!==s.currentEvent)){
   s.players.filter(p=>!p.defeated).forEach(p=>notices.push({
    id:Date.now().toString()+Math.random(),
    targetKey:p.key,
    message:s.currentEvent,
    round:s.round
   }));
  }

  const beforePlayers=Array.isArray(before)?before:[];
  const beforeAlive=beforePlayers.filter(p=>!p.defeated).map(p=>p.key);
  const afterAlive=s.players.filter(p=>!p.defeated).map(p=>p.key);
  const chiefDeath=s.players.some(p=>{
    const b=beforePlayers.find(x=>x.key===p.key);
    return b && (b.chief||0)>0 && (p.chief||0)<=0;
  });
  const homeDeath=s.players.some(p=>{
    const b=beforePlayers.find(x=>x.key===p.key);
    const home=buildingHomeName(p);
    return b && (b.buildings?.[home]||0)>0 && (p.buildings?.[home]||0)<=0;
  });
  if((chiefDeath||homeDeath) && beforeAlive.length>1 && afterAlive.length===1){
    const winner=s.players.find(p=>p.key===afterAlive[0]&&!p.defeated);
    if(winner)notices.push({
      id:'victory-'+s.round+'-'+winner.key+'-'+Date.now(),
      targetKey:winner.key,
      message:'🏆 VICTOIRE ! '+winner.emoji+' '+winner.name+(winner.chiefName?' — 👑 '+winner.chiefName:'')+' est le dernier '+(isCowboy(winner)?'Shérif':'chef')+' encore en lice !',
      round:s.round
    });
  }

  const gameRef=doc(db,'games',gameId);
  const oldSnap=await getDoc(gameRef);
  if(!oldSnap.exists())throw new Error('La partie partagée n’existe plus.');

  const data=oldSnap.data();
  const oldNotices=Array.isArray(data.notifications)?data.notifications:[];
  const notifications=oldNotices.concat(notices).slice(-100);

  await updateDoc(gameRef,{
   round:s.round,
   nextForestExhaustionRound:s.nextForestExhaustionRound,
   nextQuarryExhaustionRound:s.nextQuarryExhaustionRound,
   currentEvent:s.currentEvent||null,
   currentEventRound:s.currentEventRound??null,
   players:s.players,
   logs:s.logs,
   notifications
  });
  // Le maître republie l'état de chaque tribu dans sa sous-collection dédiée.
  // Cela garde les vues des joueurs synchronisées sans leur donner le droit
  // d'écrire les tribus adverses dans le document principal.
  await Promise.all((s.players||[]).map(p=>setDoc(
   doc(db,'games',gameId,'playerStates',p.key),
   {playerKey:p.key,player:p,updatedAt:serverTimestamp(),updatedBy:uid},
   {merge:true}
  )));
}

async function syncSharedPlayer(before,afterState,gameId,playerKey){
 if(!sharedMode||!gameId||!playerKey||!uid)return;
 const localAfter=afterState;
 const localPlayer=localAfter.players.find(p=>p.key===playerKey);
 const beforePlayer=(before||[]).find(p=>p.key===playerKey);
 if(!localPlayer)return;
 const notices=beforePlayer?diffNotifications([beforePlayer],[localPlayer],localAfter.round):[];
 const newLogs=(localAfter.logs||[]).filter(x=>!(before.logs||[]).includes(x));
 const stateRef=doc(db,'games',gameId,'playerStates',playerKey);
 const memberRef=doc(db,'games',gameId,'members',uid);
 const memberSnap=await getDoc(memberRef);
 if(!memberSnap.exists()||memberSnap.data().playerKey!==playerKey)throw new Error('Cette tribu ne vous appartient pas.');
 const previous=await getDoc(stateRef);
 const oldData=previous.exists()?previous.data():{};
 const oldNotices=Array.isArray(oldData.notifications)?oldData.notifications:[];
 const oldLogs=Array.isArray(oldData.logs)?oldData.logs:[];
 await setDoc(stateRef,{
  playerKey,
  player:localPlayer,
  notifications:oldNotices.concat(notices).slice(-100),
  logs:oldLogs.concat(newLogs).slice(-100),
  updatedAt:serverTimestamp(),
  updatedBy:uid
 },{merge:true});
}

function enqueueSharedSync(before,afterState){
 const gameId=sharedGameId;
 if(!sharedMode||!gameId)return Promise.resolve();
 sharedPendingWrites++;
 const run=sharedWriteQueue.catch(()=>{}).then(async()=>{
  try{
   if(sharedMaster) await syncShared(before,afterState,gameId);
   else await syncSharedPlayer(before,afterState,gameId,sharedPlayerKey);
  }finally{sharedPendingWrites=Math.max(0,sharedPendingWrites-1);}
 });
 sharedWriteQueue=run.catch(e=>{console.error('Synchronisation Firebase Wakam :',e);showEphemeral('⚠️ Synchronisation Firebase impossible.');});
 return run;
}

// Pont entre le script principal et le module Firebase : la fenêtre de création
// peut ainsi fonctionner en mode partagé sans accéder directement aux variables du module.
window.wakamSyncAfterCreate=async function(before,after){
 if(!sharedMode)return;
 const notices=diffNotifications(before,after,state.round);
 notices.filter(n=>n.targetKey===null||n.targetKey===sharedPlayerKey).forEach(n=>{seen.add(n.id);showEphemeral(n.message);});
 await enqueueSharedSync(before,after);
};

function wrapMutation(name){
 const fn=window[name];
 window[name]=function(...args){
  if(sharedMode&&!sharedMaster){
   const idx=args[0];
   const p=currentPlayers()[idx];
   if(!p||p.key!==sharedPlayerKey){alert('Tu peux uniquement modifier ta propre tribu.');return;}
  }
  const before=snapshotPlayers();
  const result=fn.apply(this,args);
  const after=sharedMode?cloneSharedState():null;
  if(sharedMode){
   const notices=diffNotifications(before,currentPlayers(),state.round);
   notices.filter(n=>n.targetKey===null||n.targetKey===sharedPlayerKey).forEach(n=>showEphemeral(n.message));
   enqueueSharedSync(before,after);
  }else{
   diffNotifications(before,currentPlayers(),state.round).forEach(n=>showEphemeral(n.message));
  }
  return result;
 };
}
['setVal','adjust','killUnit','build','destroyBuilding','convertStone','upgradeArcher','upgradeCavalry','upgradeArcherElite','upgradeCavalryArcher','recruitSaloonCowboy'].forEach(wrapMutation);

// La mort des unités passe par une fenêtre de confirmation : la synchronisation
// doit donc se faire au moment où la mort est réellement confirmée.
const originalConfirmDeathModal=window.confirmDeathModal;
window.confirmDeathModal=async function(){
 const before=snapshotPlayers();
 const result=originalConfirmDeathModal.apply(this,arguments);
 const after=sharedMode?cloneSharedState():null;

 if(sharedMode){
  const notices=diffNotifications(before,currentPlayers(),state.round);
  notices.filter(n=>n.targetKey===null||n.targetKey===sharedPlayerKey).forEach(n=>{
   seen.add(n.id);
   showEphemeral(n.message);
  });
  await enqueueSharedSync(before,after);
 }
 return result;
};

window.nextTurn=async function(){
 if(sharedMode){
  if(!sharedMaster){alert('Seul le maître du jeu peut passer au tour suivant.');return;}
  if(sharedTurnBusy)return;
  sharedTurnBusy=true;
  const btn=document.getElementById('nextTurnBtn');
  if(btn)btn.disabled=true;
  const before=snapshotPlayers();
  try{
   originalNextTurn();
   const after=cloneSharedState();
   await enqueueSharedSync(before,after,sharedPlayerKey);
  }catch(e){
   console.error('Passage de tour Wakam :',e);
   showEphemeral('⚠️ Erreur pendant le passage de tour.');
  }finally{
   sharedTurnBusy=false;
   if(btn)btn.disabled=!sharedMaster;
   window.render();
  }
  return;
 }
 return originalNextTurn();
};

window.saveGame=function(){
 if(sharedMode){alert('La partie partagée est sauvegardée automatiquement dans Firebase.');return;}
 return originalSaveGame();
};

window.resetGame=function(){
 if(sharedMode){alert('Quitte d’abord la partie partagée avec le bouton prévu.');return;}
 return originalResetGame();
};

window.leaveSharedGame=async function(){
 if(!confirm('Quitter cette partie sur cet appareil ?'))return;
 if(sharedUnsub)sharedUnsub();
 if(sharedPlayerStatesUnsub)sharedPlayerStatesUnsub();
 sharedUnsub=null;
 sharedPlayerStatesUnsub=null;sharedMode=false;sharedMaster=false;sharedGameId=null;sharedPlayerKey=null;seen.clear();
 sharedTurnBusy=false;sharedPendingWrites=0;sharedWriteQueue=Promise.resolve();
 localStorage.removeItem('wakamSharedSession');
 document.getElementById('leaveSharedBtn').classList.add('hidden');
 document.getElementById('setupOverlay').classList.remove('hidden');
 window.selectMode('solo');
 window.render();
};

function renderOpponentSummary(playerKey){
 const players=currentPlayers();
 const opponents=players.filter(p=>p.key!==playerKey);
 if(!opponents.length)return '';
 return `<div class="opponentSummary"><b>👁️ Adversaires — en temps réel</b><table class="opponentTable"><thead><tr><th>Équipe</th><th>👥</th><th>🤠</th><th>🐎</th><th>🛶</th></tr></thead><tbody>${opponents.map(p=>`<tr><td>${escapeHtml(p.name||'')}</td><td>${p.villagers||0}</td><td>${p.archers||0}</td><td>${p.cavalry||0}</td><td>${p.canoes||0}</td></tr>`).join('')}</tbody></table></div>`;
}
window.render=function(){
 originalRender();
 // Sauvegarde automatique de la partie classique après chaque modification.
 // En partie partagée, Firebase reste la source de vérité.
 if(!sharedMode){
  try{localStorage.setItem('wakamSave',JSON.stringify(window.wakamState));}catch(e){}
 }
 const s=window.wakamState;
 if(sharedMode){
  document.getElementById('sharedStatus').innerHTML=`🌐 Partie <b>${sharedGameId}</b> · ${sharedMaster?'<span class="role master">👑 Maître du jeu</span>':'<span class="role">👤 Joueur</span>'}`;
  document.getElementById('nextTurnBtn').disabled=!sharedMaster;
  if(!sharedMaster){
   document.querySelectorAll('#players .card').forEach(card=>{if(!card.classList.contains(sharedPlayerKey))card.style.display='none';});
   const card=document.querySelector('#players .card.'+CSS.escape(sharedPlayerKey));
   if(card){
    card.insertAdjacentHTML('beforeend',renderOpponentSummary(sharedPlayerKey));
    card.querySelectorAll('button,input').forEach(el=>{if(!el.classList.contains('chiefNameBtn'))el.disabled=false;});
   }
  }
  const notice=document.getElementById('eventNotice');
  if(s.currentEventRound!==s.round)notice.innerHTML='';
 }
};

window.addEventListener('beforeunload',()=>{
 if(sharedUnsub)sharedUnsub();
});
</script>
